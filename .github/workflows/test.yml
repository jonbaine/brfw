name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  BPFTOOL_VERSION: v7.5.0

jobs:
  build:
    name: Compile test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm llvm-18 libelf-dev libbpf-dev \
            pkg-config zlib1g-dev

      - name: Install bpftool
        run: |
          curl -sL https://github.com/libbpf/bpftool/releases/download/$BPFTOOL_VERSION/bpftool-$BPFTOOL_VERSION-amd64.tar.gz \
            | sudo tar xzf - -C /usr/local/bin bpftool
          sudo chmod +x /usr/local/bin/bpftool

      - name: Generate vmlinux.h
        run: cd src && make vmlinux.h

      - name: Build and verify
        run: cd src && make test-compile

  integration:
    name: Integration tests
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm llvm-18 libelf-dev libbpf-dev \
            pkg-config zlib1g-dev

      - name: Install bpftool
        run: |
          curl -sL https://github.com/libbpf/bpftool/releases/download/$BPFTOOL_VERSION/bpftool-$BPFTOOL_VERSION-amd64.tar.gz \
            | sudo tar xzf - -C /usr/local/bin bpftool
          sudo chmod +x /usr/local/bin/bpftool

      - name: Check BTF support
        run: |
          if [ ! -f /sys/kernel/btf/vmlinux ]; then
            echo "::warning::Kernel BTF not available, integration tests will be skipped"
          fi

      - name: Build
        run: cd src && make

      - name: Run integration tests
        run: sudo tests/run_tests.sh
